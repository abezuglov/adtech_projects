# Season 2 advertiser campaigns used for this project.
# See data/README.md for the full advertiser category table and schema notes.
advertisers:
  - id: 1458
    industry: "Chinese vertical e-commerce"
    role: primary  # recurs across RTB literature; used as the main deep-dive campaign
  - id: 3358
    industry: "Software"
    role: warm_start_holdout  # sparsest campaign over the full week (2.36M bids vs 5.8-12.3M for the others) -- held out as the "new campaign" for the warm-start experiment
  - id: 3386
    industry: "International e-commerce"
    role: secondary
  - id: 3427
    industry: "Oil"
    role: secondary
  - id: 3476
    industry: "Tire"
    role: secondary

paths:
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"

# Campaign delivery scenarios (target geo, flight window, impressions
# target X, CTR floor Y) shared by the naive baseline and the bandit, so
# both are evaluated against exactly the same problems. Randomly generated
# (fixed seed) by scripts/generate_scenarios.py and committed to
# config/scenarios.yaml rather than here, so regenerating them doesn't
# clobber this file's hand-written comments (yaml.safe_load/dump discards
# comments on a round-trip -- learned the hard way).
scenarios_file: "config/scenarios.yaml"
